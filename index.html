<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>Lyrics Player & MP4 Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: transparent;
      color: white;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* ===== 전체 구조 ===== */
    #container {
      display: flex;
      height: 100%;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    #bgArt {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-size: cover;
      background-position: center;
      filter: blur(40px) brightness(0.35);
      transform: scale(1.04);
      z-index: 0;
      display: none;
    }

    /* ===== 비디오/이미지 영역 ===== */
    #video-area {
      flex: 0 0 55%;
      background: rgba(0, 0, 0, 0);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    video,
    #albumArtLarge {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
    }

    #albumArtLarge {
      display: none;
      border-radius: 0;
    }

    /* ===== 가사 영역 ===== */
    #lyrics-area {
      flex: 1;
      background: rgba(0, 0, 0, 0.25);
      padding: 60px 40px 80px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    #lyrics-area::-webkit-scrollbar {
      width: 8px;
    }

    #lyrics-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }

    .line {
      opacity: 0.4;
      font-size: 1.2em;
      margin: 12px 0;
      text-align: center;
      transition: opacity 0.6s ease, font-size 0.4s ease;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      cursor: pointer;
    }

    .active {
      opacity: 1;
      font-size: 1.9em;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
    }

    /* ===== 오른쪽 위 작은 앨범아트 ===== */
    #albumArt {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 100px;
      height: 100px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      object-fit: cover;
      display: none;
      cursor: pointer;
      z-index: 10;
    }

    #albumPopup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    #albumPopup img {
      max-width: 80%;
      max-height: 80%;
      border-radius: 16px;
    }

    /* ===== 오디오 컨트롤 ===== */
    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 55%;
      background: transparent;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 5;
    }

    audio {
      width: 70%;
      max-width: 500px;
    }

    /* ===== 파일 선택 ===== */
    #songInput {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      background: white;
      color: black;
      padding: 18px 26px;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
      z-index: 40;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 600ms ease;
    }

    #songInput.compact {
      top: 15px;
      left: 15px;
      transform: translate(0, 0) scale(1);
      padding: 6px 10px;
      border-radius: 6px;
      width: auto;
      box-shadow: none;
      z-index: 50;
    }

    body:not(.show-ui) #container,
    body:not(.show-ui) #albumArt,
    body:not(.show-ui) #controls,
    body:not(.show-ui) #bgArt,
    body:not(.show-ui) #albumPopup {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px) scale(0.995);
      transition: opacity 600ms ease, transform 600ms ease;
    }

    body.show-ui #container,
    body.show-ui #albumArt,
    body.show-ui #controls,
    body.show-ui #bgArt,
    body.show-ui #albumPopup {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    /* ===== 우측 슬라이드 툴바 및 토글 화살표 버튼 (초기 상태에서도 명확히 표시) ===== */
    #toolbarToggleBtn {
      position: fixed;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #21262d;
      color: white;
      border-radius: 10px;
      z-index: 120;
      cursor: pointer;
      transition: background 0.2s, right 0.3s ease, transform 0.3s ease, border-color 0.2s;
      border: 1px solid #30363d;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }

    #toolbarToggleBtn:hover {
      background: #30363d;
      border-color: #8b949e;
    }

    #toolbarToggleBtn.open {
      right: 225px;
      transform: translateY(-50%) rotate(180deg);
    }

    #sideToolbar {
      position: fixed;
      top: 0;
      right: -260px;
      width: 250px;
      height: 100%;
      background: #161b22;
      border-left: 1px solid #30363d;
      z-index: 110;
      padding: 80px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: right 0.3s ease;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
    }

    #sideToolbar.open {
      right: 0;
    }

    .toolbar-btn {
      width: 100%;
      padding: 12px;
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      text-decoration: none;
    }

    .toolbar-btn:hover {
      background: #30363d;
      color: white;
      border-color: #8b949e;
    }

    .toolbar-btn.primary {
      background: #238636;
      color: white;
      border: none;
    }

    .toolbar-btn.primary:hover {
      background: #2ea043;
    }

    #credit {
      position: fixed;
      right: 15px;
      bottom: 15px;
      background: rgba(0, 0, 0, 0.5);
      color: rgba(255, 255, 255, 0.95);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.3;
      max-width: 320px;
      z-index: 45;
      display: none;
      white-space: pre-wrap;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      transition: opacity 400ms ease, transform 400ms ease;
    }

    #credit.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== 모달 백드롭 및 카드 ===== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      width: 90%;
      max-width: 500px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
      color: #f0f6fc;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: white;
      padding: 10px;
      font-size: 13px;
      font-family: inherit;
    }

    textarea.form-control {
      height: 160px;
      resize: vertical;
    }

    .radio-group {
      display: flex;
      gap: 12px;
    }

    .radio-option {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #21262d;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .radio-option input[type="radio"] {
      accent-color: #238636;
    }

    .switch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #21262d;
      border: 1px solid #30363d;
      padding: 12px 16px;
      border-radius: 8px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #30363d;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #238636;
    }

    input:checked+.slider:before {
      transform: translateX(20px);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-primary {
      flex: 1;
      padding: 12px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: #2ea043;
    }

    .btn-secondary {
      padding: 12px 18px;
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: #30363d;
    }

    /* 진행도 및 터미널 모달 */
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-title {
      font-size: 16px;
      font-weight: 600;
      color: #e6edf3;
    }

    .progress-percent {
      font-size: 16px;
      font-weight: bold;
      color: #58a6ff;
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #21262d;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #238636, #2ea043);
      transition: width 0.3s ease;
    }

    .toggle-log-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 0;
    }

    .toggle-log-btn:hover {
      color: #58a6ff;
    }

    #terminalContainer {
      display: none;
      margin-top: 12px;
    }

    .terminal-box {
      background: #000000;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      height: 200px;
      overflow-y: auto;
      font-family: Consolas, 'Courier New', monospace;
      font-size: 12px;
      color: #39ff14;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* 에러 오버레이 */
    #errorOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
      padding: 20px;
    }

    #errorContainer {
      width: 100%;
      max-width: 720px;
      height: 70%;
      background: transparent;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    #errorFrame {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    .err-close {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 0;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <input type="file" id="songInput" accept=".music,.song,.zip">
  <img id="albumArt" />
  <div id="albumPopup"><img /></div>
  <div id="bgArt"></div>

  <!-- 우측 슬라이드 툴바 토글 버튼 (화살표) -->
  <button id="toolbarToggleBtn" title="메뉴 열기">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <!-- 우측 슬라이드 툴바 -->
  <div id="sideToolbar">
    <button class="toolbar-btn primary" id="openMp4ModalBtn">
      🎬 MP4 비디오 변환
    </button>
    <button class="toolbar-btn" id="openSongModalBtn">
      🎵 .song 패키지 생성
    </button>
    <button class="toolbar-btn" id="openSettingsModalBtn" style="display: none;">
      ⚙️ 서버 설정
    </button>
    <a class="toolbar-btn" href="https://github.com/doctorheo/lyrics" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
        <path fill-rule="evenodd"
          d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2 .37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.6 7.6 0 018 4.58c.68.003 1.36.092 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z">
        </path>
      </svg>
      GitHub
    </a>
  </div>

  <div id="credit" aria-hidden="true"></div>

  <div id="container">
    <div id="video-area">
      <video id="video" controls preload="metadata"></video>
      <img id="albumArtLarge" />
    </div>
    <div id="lyrics-area"></div>
  </div>

  <div id="controls">
    <audio id="audio" controls style="display:none"></audio>
  </div>

  <!-- 1. MP4 변환 옵션 모달 -->
  <div class="modal-backdrop" id="optionsModal">
    <div class="modal-card">
      <div class="modal-title">⚙️ MP4 변환 옵션 설정</div>

      <div class="form-group">
        <label class="form-label">렌더링 모드 선택</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="renderMode" value="classic">
            클래식 모드
          </label>
          <label class="radio-option">
            <input type="radio" name="renderMode" value="new">
            신버전 모드
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">옵션</label>
        <div class="switch-row">
          <span class="switch-label">앨범아트 첨부</span>
          <label class="switch">
            <input type="checkbox" id="attachAlbumArt" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-secondary" id="cancelOptionBtn">취소</button>
        <button class="btn-primary" id="startGenerateBtn">생성</button>
      </div>
    </div>
  </div>

  <!-- 2. .song 패키지 생성 모달 -->
  <div class="modal-backdrop" id="createSongModal">
    <div class="modal-card">
      <div class="modal-title">🎵 .song 패키지 생성 (Whisper AI)</div>

      <div class="form-group">
        <label class="form-label">1. 음원 파일 선택 (*.mp3, *.wav, *.m4a, *.flac, *.mp4)</label>
        <input type="file" id="songAudioFileInput" class="form-control" accept=".mp3,.wav,.m4a,.flac,.mp4">
      </div>

      <div class="form-group">
        <label class="form-label">2. 전체 가사 입력 (줄바꿈 구분)</label>
        <textarea id="songLyricsInput" class="form-control" placeholder="여기에 전체 가사를 복사해서 붙여넣어 주세요..."></textarea>
      </div>

      <div class="btn-group">
        <button class="btn-secondary" id="cancelSongModalBtn">취소</button>
        <button class="btn-primary" id="startCreateSongBtn">생성</button>
      </div>
    </div>
  </div>

  <!-- 3. 서버 모드 설정 모달 -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-card">
      <div class="modal-title">⚙️ 백엔드 서버 설정</div>

      <div class="form-group">
        <label class="form-label">통신할 백엔드 서버를 선택하세요</label>
        <div class="radio-group" style="flex-direction: column;">
          <label class="radio-option">
            <input type="radio" name="serverMode" value="cloud" checked>
            🌐 클라우드 서버 (Render)
          </label>
          <label class="radio-option">
            <input type="radio" name="serverMode" value="local">
            💻 로컬 서버 (http://localhost:8000)
          </label>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-secondary" id="cancelSettingsBtn">취소</button>
        <button class="btn-primary" id="saveSettingsBtn">저장</button>
      </div>
    </div>
  </div>

  <!-- 4. 진행도 및 터미널 팝업 모달 -->
  <div class="modal-backdrop" id="progressOverlay">
    <div class="modal-card">
      <div class="progress-header">
        <span class="progress-title" id="overlayTitle">⚡ 생성 작업 처리 중...</span>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>

      <button class="toggle-log-btn" id="toggleLogBtn">▼ 자세히 보기 (로그)</button>

      <div id="terminalContainer">
        <pre class="terminal-box" id="terminalLog"></pre>
      </div>

      <div class="btn-group">
        <button class="btn-secondary" id="closeOverlayBtn" style="display:none; width: 100%;">창 닫기</button>
      </div>
    </div>
  </div>

  <!-- 에러 오버레이 -->
  <div id="errorOverlay">
    <div id="errorContainer">
      <button class="err-close" id="errCloseBtn">닫기</button>
      <iframe id="errorFrame" title="오류" sandbox="allow-same-origin allow-scripts"></iframe>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    // ===== 서버 모드 및 API URL 관리 =====
    const RENDER_URL = "https://lyrics-mk0x.onrender.com";
    const LOCAL_URL = "http://localhost:8000";

    const isGitHubPages = window.location.hostname.endsWith("github.io");
    let apiBaseUrl = RENDER_URL;

    // github.io가 아닐 때만 설정 버튼을 표시하고 저장된 모드를 로드
    const openSettingsModalBtn = document.getElementById("openSettingsModalBtn");
    if (!isGitHubPages) {
      openSettingsModalBtn.style.display = "flex";
      const savedMode = localStorage.getItem("serverMode") || "cloud";
      apiBaseUrl = savedMode === "local" ? LOCAL_URL : RENDER_URL;
      const radioBtn = document.querySelector(`input[name="serverMode"][value="${savedMode}"]`);
      if (radioBtn) radioBtn.checked = true;
    }

    let lrcData = [];
    let currentIndex = -1;

    const lyricsArea = document.getElementById("lyrics-area");
    const audioEl = document.getElementById("audio");
    const videoEl = document.getElementById("video");
    const albumArtEl = document.getElementById("albumArt");
    const albumArtLarge = document.getElementById("albumArtLarge");
    const albumPopup = document.getElementById("albumPopup");
    const songInput = document.getElementById("songInput");
    const bgArt = document.getElementById("bgArt");
    const creditEl = document.getElementById("credit");

    // 툴바 엘리먼트
    const toolbarToggleBtn = document.getElementById("toolbarToggleBtn");
    const sideToolbar = document.getElementById("sideToolbar");
    const openMp4ModalBtn = document.getElementById("openMp4ModalBtn");
    const openSongModalBtn = document.getElementById("openSongModalBtn");

    // MP4 모달 엘리먼트
    const optionsModal = document.getElementById("optionsModal");
    const cancelOptionBtn = document.getElementById("cancelOptionBtn");
    const startGenerateBtn = document.getElementById("startGenerateBtn");
    const attachAlbumArt = document.getElementById("attachAlbumArt");
    const renderModeRadios = document.querySelectorAll('input[name="renderMode"]');

    // .song 생성 모달 엘리먼트
    const createSongModal = document.getElementById("createSongModal");
    const cancelSongModalBtn = document.getElementById("cancelSongModalBtn");
    const startCreateSongBtn = document.getElementById("startCreateSongBtn");
    const songAudioFileInput = document.getElementById("songAudioFileInput");
    const songLyricsInput = document.getElementById("songLyricsInput");

    // 서버 설정 모달 엘리먼트
    const settingsModal = document.getElementById("settingsModal");
    const cancelSettingsBtn = document.getElementById("cancelSettingsBtn");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");

    // 진행 오버레이 엘리먼트
    const progressOverlay = document.getElementById("progressOverlay");
    const progressBarFill = document.getElementById("progressBarFill");
    const progressPercent = document.getElementById("progressPercent");
    const overlayTitle = document.getElementById("overlayTitle");
    const terminalLog = document.getElementById("terminalLog");
    const terminalContainer = document.getElementById("terminalContainer");
    const toggleLogBtn = document.getElementById("toggleLogBtn");
    const closeOverlayBtn = document.getElementById("closeOverlayBtn");

    // MP4 모달 신버전 모드 선택 시 클릭 경고 이벤트 연결
    renderModeRadios.forEach(radio => {
      radio.addEventListener("change", (e) => {
        if (e.target.value === "new" && apiBaseUrl === RENDER_URL) {
          alert("⚠️ [경고] 클라우드(Render.com) 무료 서버 환경에서는 메모리 및 CPU 제한으로 인해 '신버전 모드' 변환 속도가 매우 느릴 수 있습니다.");
        }
      });
    });

    function parseLRC(text) {
      const lines = text.split(/\r?\n/);
      const result = [];
      const timeExp = /\[(\d+):(\d+(?:\.\d+)?)\]/;
      for (const line of lines) {
        const match = line.match(timeExp);
        if (match) {
          const min = parseInt(match[1], 10);
          const sec = parseFloat(match[2]);
          const time = min * 60 + sec;
          const textPart = line.replace(timeExp, "").trim();
          result.push({ time, text: textPart });
        }
      }
      return result;
    }

    function addIntroOutro(data, threshold = 5) {
      const augmented = [];
      if (data.length === 0) return augmented;
      if (data[0].time > threshold)
        augmented.push({ time: 0, text: "🎵 Instrumental..." });
      augmented.push(...data);
      return augmented;
    }

    function appendRawLog(rawText) {
      terminalLog.textContent += rawText + "\n";
      terminalLog.scrollTop = terminalLog.scrollHeight;
    }

    function redirectToError(code, message, fileName) {
      const params = new URLSearchParams({ code: code || '', msg: message || '', file: fileName || '' });
      const overlay = document.getElementById('errorOverlay');
      const frame = document.getElementById('errorFrame');
      const closeBtn = document.getElementById('errCloseBtn');
      if (frame && overlay) {
        params.append('isifr', 'true');
        frame.src = 'error.html?' + params.toString();
        overlay.style.display = 'flex';
        if (closeBtn) closeBtn.onclick = () => {
          frame.src = 'about:blank';
          overlay.style.display = 'none';
        };
      } else {
        window.location.href = 'error.html?' + params.toString();
      }
    }

    // 툴바 토글 기능
    toolbarToggleBtn.addEventListener("click", () => {
      toolbarToggleBtn.classList.toggle("open");
      sideToolbar.classList.toggle("open");
    });

    songInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      let zip;
      try {
        zip = await JSZip.loadAsync(file);
      } catch (err) {
        redirectToError('zip_read_error', '압축을 읽을 수 없습니다: ' + (err && err.message ? err.message : err), file.name);
        return;
      }
      if (!zip || Object.keys(zip.files).length === 0) {
        redirectToError('empty_zip', '압축 내부에 파일이 없습니다.', file.name);
        return;
      }

      let isVideo = false, mediaBlob = null, albumUrl = null, creditText = null;

      for (const name of Object.keys(zip.files)) {
        if (name.endsWith(".lrc")) {
          const text = await zip.files[name].async("string");
          lrcData = addIntroOutro(parseLRC(text));
        } else if (name.endsWith(".mp3")) {
          const data = await zip.files[name].async("blob");
          mediaBlob = new Blob([data], { type: "audio/mpeg" });
          isVideo = false;
        } else if (name.endsWith(".mp4")) {
          const data = await zip.files[name].async("blob");
          mediaBlob = new Blob([data], { type: "video/mp4" });
          isVideo = true;
        } else if (name.match(/cover.*\.(jpg|png)$/i)) {
          const data = await zip.files[name].async("blob");
          albumUrl = URL.createObjectURL(data);
        } else if (name.match(/(^|\/)crd\.txt$/i)) {
          const text = await zip.files[name].async("string");
          creditText = text;
        }
      }

      if (albumUrl) {
        albumArtEl.src = albumUrl;
        albumArtEl.style.display = "block";
        albumArtEl.onclick = () => {
          albumPopup.style.display = "flex";
          albumPopup.querySelector("img").src = albumUrl;
        };
        albumPopup.onclick = () => (albumPopup.style.display = "none");
        albumArtLarge.src = albumUrl;
        if (bgArt) {
          bgArt.style.backgroundImage = `url(${albumUrl})`;
          bgArt.style.display = 'block';
        }
      }

      if (creditText && creditEl) {
        creditEl.textContent = creditText.trim();
        creditEl.classList.add('visible');
        creditEl.setAttribute('aria-hidden', 'false');
      } else if (creditEl) {
        creditEl.classList.remove('visible');
        creditEl.setAttribute('aria-hidden', 'true');
        creditEl.style.display = 'none';
      }

      if (!mediaBlob) {
        redirectToError('no_media', '미디어 파일(mp3 또는 mp4)을 찾을 수 없습니다.', file.name);
        return;
      }

      songInput.classList.add('compact');
      document.body.classList.add('show-ui');

      if (isVideo) {
        videoEl.src = URL.createObjectURL(mediaBlob);
        videoEl.style.display = "block";
        audioEl.style.display = "none";
        albumArtLarge.style.display = "none";
      } else {
        audioEl.src = URL.createObjectURL(mediaBlob);
        audioEl.style.display = "block";
        videoEl.style.display = "none";
        albumArtLarge.style.display = albumUrl ? "block" : "none";
      }

      if (!albumUrl && bgArt) bgArt.style.display = 'none';

      renderLyrics();
      setupSync(isVideo ? videoEl : audioEl);
    });

    function renderLyrics() {
      lyricsArea.innerHTML = "";
      if (!lrcData || lrcData.length === 0) {
        lyricsArea.style.display = 'none';
        const videoArea = document.getElementById('video-area');
        if (videoArea) videoArea.style.flex = '1';
        const controls = document.getElementById('controls');
        if (controls) controls.style.width = '100%';
      } else {
        lyricsArea.style.display = '';
        const videoArea = document.getElementById('video-area');
        if (videoArea) videoArea.style.flex = '0 0 55%';
        const controls = document.getElementById('controls');
        if (controls) controls.style.width = '55%';

        lrcData.forEach((line) => {
          const div = document.createElement("div");
          div.className = "line";
          div.textContent = line.text || " ";
          div.onclick = () => {
            const player = videoEl.style.display === "block" ? videoEl : audioEl;
            player.currentTime = line.time;
            player.play();
          };
          lyricsArea.appendChild(div);
        });
      }
    }

    function setupSync(player) {
      const lines = Array.from(document.querySelectorAll(".line"));
      player.ontimeupdate = () => {
        const t = player.currentTime;
        let idx = 0;
        for (let i = lrcData.length - 1; i >= 0; i--) {
          if (t >= lrcData[i].time) { idx = i; break; }
        }
        if (idx !== currentIndex) {
          currentIndex = idx;
          lines.forEach((l, i) => l.classList.toggle("active", i === idx));

          const activeLine = lines[idx];
          if (activeLine) {
            const offsetTop = activeLine.offsetTop - lyricsArea.clientHeight / 2 + activeLine.clientHeight / 2;
            lyricsArea.scrollTo({ top: offsetTop, behavior: "smooth" });
          }
        }
      };
      player.onended = () => {
        currentIndex = -1;
        lines.forEach((l) => l.classList.remove('active'));
      };
    }

    // 모달 여닫기 제어
    openMp4ModalBtn.onclick = () => {
      // 시작 시 라디오 버튼을 하나도 선택되지 않게 초기화
      renderModeRadios.forEach(radio => radio.checked = false);
      optionsModal.style.display = "flex";
    };
    cancelOptionBtn.onclick = () => { optionsModal.style.display = "none"; };

    openSongModalBtn.onclick = () => {
      // Render.com 서버 환경일 때 .song 패키지 생성 시도 차단
      if (apiBaseUrl === RENDER_URL) {
        alert("🚫 [제한] Render.com 클라우드 서버 환경에서는 메모리 한계로 인해 .song 패키지 생성을 사용할 수 없습니다.\n로컬 서버(http://localhost:8000)를 이용해 주세요.");
        return;
      }
      createSongModal.style.display = "flex";
    };
    cancelSongModalBtn.onclick = () => { createSongModal.style.display = "none"; };

    openSettingsModalBtn.onclick = () => { settingsModal.style.display = "flex"; };
    cancelSettingsBtn.onclick = () => { settingsModal.style.display = "none"; };

    saveSettingsBtn.onclick = () => {
      const selectedMode = document.querySelector('input[name="serverMode"]:checked').value;
      localStorage.setItem("serverMode", selectedMode);
      apiBaseUrl = selectedMode === "local" ? LOCAL_URL : RENDER_URL;
      settingsModal.style.display = "none";
      alert(`서버 설정이 [${selectedMode === "local" ? "로컬 모드" : "클라우드 모드"}]로 변경되었습니다.`);
    };

    toggleLogBtn.onclick = () => {
      if (terminalContainer.style.display === "block") {
        terminalContainer.style.display = "none";
        toggleLogBtn.textContent = "▼ 자세히 보기 (로그)";
      } else {
        terminalContainer.style.display = "block";
        toggleLogBtn.textContent = "▲ 자세히 보기 닫기";
      }
    };

    closeOverlayBtn.onclick = () => { progressOverlay.style.display = "none"; };

    // SSE 작업 파이프라인 함수
    function runTaskPipeline(endpoint, formData, titleText) {
      terminalLog.textContent = "";
      progressBarFill.style.width = "0%";
      progressPercent.textContent = "0%";
      overlayTitle.textContent = titleText;
      closeOverlayBtn.style.display = "none";
      terminalContainer.style.display = "none";
      toggleLogBtn.textContent = "▼ 자세히 보기 (로그)";
      progressOverlay.style.display = "flex";

      fetch(endpoint, { method: "POST", body: formData })
        .then(res => {
          if (!res.ok) throw new Error("서버 작업 요청 실패");
          return res.json();
        })
        .then(data => {
          const taskId = data.task_id;
          const eventSource = new EventSource(`${apiBaseUrl}/stream_logs/${taskId}`);

          eventSource.onmessage = (event) => {
            const payload = JSON.parse(event.data);

            if (payload.progress !== undefined) {
              progressBarFill.style.width = `${payload.progress}%`;
              progressPercent.textContent = `${payload.progress}%`;
            }

            if (payload.logs && payload.logs.length > 0) {
              payload.logs.forEach(log => appendRawLog(log));
            }

            if (payload.status === "completed") {
              eventSource.close();
              overlayTitle.textContent = "🎉 생성 완료!";
              closeOverlayBtn.style.display = "block";

              const downloadUrl = `${apiBaseUrl}/download/${taskId}`;
              const a = document.createElement("a");
              a.href = downloadUrl;
              a.click();
            } else if (payload.status === "error") {
              eventSource.close();
              overlayTitle.textContent = "❌ 생성 실패";
              closeOverlayBtn.style.display = "block";
              alert(`처리 실패: ${payload.error}`);
            }
          };

          eventSource.onerror = (err) => {
            console.error("SSE 통신 에러:", err);
            eventSource.close();
            closeOverlayBtn.style.display = "block";
          };
        })
        .catch(err => {
          alert("서버 통신 에러가 발생했습니다.");
          console.error(err);
          progressOverlay.style.display = "none";
        });
    }

    // 1) MP4 비디오 생성 클릭
    startGenerateBtn.addEventListener("click", () => {
      const file = songInput.files[0];
      if (!file) {
        alert("플레이어에 먼저 노래 파일(.song 또는 .zip)을 로드해 주세요!");
        return;
      }

      const selectedRadio = document.querySelector('input[name="renderMode"]:checked');
      if (!selectedRadio) {
        alert("렌더링 모드(클래식 모드 또는 신버전 모드)를 선택해 주세요!");
        return;
      }

      const selectedMode = selectedRadio.value;
      const isAttachArt = attachAlbumArt.checked;

      // 신버전 모드 선택 시 생성 버튼 클릭 시점에 추가 오버레이 확인창 표시
      if (selectedMode === "new" && apiBaseUrl === RENDER_URL) {
        const confirmResult = confirm("⚠️ [최종 확인]\n클라우드(Render.com) 서버 환경에서 신버전 모드는 변환 작업이 매우 오래 걸릴 수 있습니다.\n계속 진행하시겠습니까?");
        if (!confirmResult) {
          return;
        }
      }

      optionsModal.style.display = "none";

      const formData = new FormData();
      formData.append("file", file);
      formData.append("mode", selectedMode);
      formData.append("attach_art", isAttachArt);

      runTaskPipeline(`${apiBaseUrl}/start_convert`, formData, "⚡ MP4 비디오 변환 중...");
    });

    // 2) .song 패키지 생성 클릭 (전부 입력 검증 포함)
    startCreateSongBtn.addEventListener("click", () => {
      const audioFile = songAudioFileInput.files[0];
      const lyricsText = songLyricsInput.value.trim();

      // 전부 입력되지 않은 경우 차단
      if (!audioFile) {
        alert("음원 파일을 선택해 주세요!");
        songAudioFileInput.focus();
        return;
      }

      if (!lyricsText) {
        alert("전체 가사를 입력해 주세요!");
        songLyricsInput.focus();
        return;
      }

      createSongModal.style.display = "none";

      const formData = new FormData();
      formData.append("audio_file", audioFile);
      formData.append("lyrics", lyricsText);

      runTaskPipeline(`${apiBaseUrl}/start_create_song`, formData, "🎵 .song 패키지 분석 및 생성 중...");
    });
  </script>
</body>

</html>
